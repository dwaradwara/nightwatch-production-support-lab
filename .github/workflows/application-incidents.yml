name: OPSFORGE Application Incidents

on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "scripts/build_release.sh"
      - "scripts/app_incident_*.sh"
      - "operations/records/**"
      - "docs/PHASE6-APPLICATION.md"
      - "docs/APP-*.md"
      - ".github/workflows/application-incidents.yml"
  workflow_dispatch:

jobs:
  app-001-api-500-regression:
    runs-on: ubuntu-latest
    env:
      APP001_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/app-001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate APP-001 shell syntax
        run: |
          bash -n scripts/app_incident_001.sh
          bash -n scripts/build_release.sh

      - name: Prepare CI secrets and TLS
        run: |
          cp .env.example .env
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout tls/nightwatch-fixed.key \
            -out tls/nightwatch-fixed.crt \
            -days 1 \
            -subj "/CN=nightwatch.local" \
            -addext "subjectAltName=DNS:nightwatch.local"

      - name: Define APP-001 releases
        run: |
          SHORT_SHA="${GITHUB_SHA::10}"
          echo "APP001_GOOD_RELEASE=app001-good-$SHORT_SHA" >> "$GITHUB_ENV"
          echo "APP001_BAD_RELEASE=app001-bad-$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Build known-good release
        run: bash scripts/build_release.sh "$APP001_GOOD_RELEASE"

      - name: Build application-regression release
        run: |
          bash scripts/build_release.sh "$APP001_BAD_RELEASE" ticket-read-api-500
          docker run --rm "nightwatch-api:$APP001_BAD_RELEASE" python -m py_compile /app/app.py

      - name: Exercise APP-001 diagnosis rollback and recovery
        run: bash scripts/app_incident_001.sh "$APP001_GOOD_RELEASE" "$APP001_BAD_RELEASE"

      - name: Show APP-001 evidence summary
        if: always()
        run: |
          find "$APP001_EVIDENCE_DIR" -maxdepth 1 -type f -print | sort || true
          cat "$APP001_EVIDENCE_DIR/diagnosis.txt" 2>/dev/null || true
          cat "$APP001_EVIDENCE_DIR/recovery.txt" 2>/dev/null || true

      - name: Upload APP-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-app001-evidence-${{ github.run_id }}
          path: .opsforge/evidence/app-001
          if-no-files-found: warn
          retention-days: 7

      - name: Clean APP-001 environment
        if: always()
        run: bash scripts/down_environment.sh staging --volumes || true

  app-002-dependency-timeout:
    runs-on: ubuntu-latest
    env:
      APP002_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/app-002

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate APP-002 syntax
        run: |
          bash -n scripts/app_incident_002.sh
          bash -n scripts/build_release.sh
          python -m py_compile api/opsforge_app002_patch.py

      - name: Prepare CI secrets and TLS
        run: |
          cp .env.example .env
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout tls/nightwatch-fixed.key \
            -out tls/nightwatch-fixed.crt \
            -days 1 \
            -subj "/CN=nightwatch.local" \
            -addext "subjectAltName=DNS:nightwatch.local"

      - name: Define APP-002 release
        run: |
          SHORT_SHA="${GITHUB_SHA::10}"
          echo "APP002_RELEASE=app002-$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Build dependency-timeout exercise release
        run: |
          bash scripts/build_release.sh "$APP002_RELEASE" ticket-read-dependency-timeout
          docker run --rm "nightwatch-api:$APP002_RELEASE" python -m py_compile /app/app.py /app/opsforge_app002_patch.py

      - name: Exercise APP-002 diagnosis and dependency recovery
        run: bash scripts/app_incident_002.sh "$APP002_RELEASE"

      - name: Show APP-002 evidence summary
        if: always()
        run: |
          find "$APP002_EVIDENCE_DIR" -maxdepth 1 -type f -print | sort || true
          cat "$APP002_EVIDENCE_DIR/diagnosis.txt" 2>/dev/null || true
          cat "$APP002_EVIDENCE_DIR/recovery.txt" 2>/dev/null || true

      - name: Upload APP-002 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-app002-evidence-${{ github.run_id }}
          path: .opsforge/evidence/app-002
          if-no-files-found: warn
          retention-days: 7

      - name: Clean APP-002 environment
        if: always()
        run: |
          docker rm -f opsforge-app002-dependency >/dev/null 2>&1 || true
          bash scripts/down_environment.sh staging --volumes || true

  app-003-malformed-configuration:
    runs-on: ubuntu-latest
    env:
      APP003_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/app-003

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate APP-003 syntax
        run: |
          bash -n scripts/app_incident_003.sh
          bash -n scripts/build_release.sh
          python -m py_compile api/opsforge_app003_patch.py

      - name: Prepare CI secrets and TLS
        run: |
          cp .env.example .env
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout tls/nightwatch-fixed.key \
            -out tls/nightwatch-fixed.crt \
            -days 1 \
            -subj "/CN=nightwatch.local" \
            -addext "subjectAltName=DNS:nightwatch.local"

      - name: Define APP-003 release
        run: |
          SHORT_SHA="${GITHUB_SHA::10}"
          echo "APP003_RELEASE=app003-$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Build configuration-aware exercise release
        run: |
          bash scripts/build_release.sh "$APP003_RELEASE" ticket-read-malformed-config
          docker run --rm "nightwatch-api:$APP003_RELEASE" python -m py_compile /app/app.py /app/opsforge_app003_patch.py

      - name: Exercise APP-003 diagnosis and configuration recovery
        run: bash scripts/app_incident_003.sh "$APP003_RELEASE"

      - name: Show APP-003 evidence summary
        if: always()
        run: |
          find "$APP003_EVIDENCE_DIR" -maxdepth 1 -type f -print | sort || true
          cat "$APP003_EVIDENCE_DIR/diagnosis.txt" 2>/dev/null || true
          cat "$APP003_EVIDENCE_DIR/recovery.txt" 2>/dev/null || true

      - name: Upload APP-003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-app003-evidence-${{ github.run_id }}
          path: .opsforge/evidence/app-003
          if-no-files-found: warn
          retention-days: 7

      - name: Clean APP-003 environment
        if: always()
        run: bash scripts/down_environment.sh staging --volumes || true

  app-004-cpu-saturation:
    runs-on: ubuntu-latest
    env:
      APP004_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/app-004

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate APP-004 syntax
        run: |
          bash -n scripts/app_incident_004.sh
          bash -n scripts/build_release.sh

      - name: Prepare CI secrets and TLS
        run: |
          cp .env.example .env
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout tls/nightwatch-fixed.key \
            -out tls/nightwatch-fixed.crt \
            -days 1 \
            -subj "/CN=nightwatch.local" \
            -addext "subjectAltName=DNS:nightwatch.local"

      - name: Define APP-004 release
        run: |
          SHORT_SHA="${GITHUB_SHA::10}"
          echo "APP004_RELEASE=app004-$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Build normal resource exercise release
        run: bash scripts/build_release.sh "$APP004_RELEASE"

      - name: Exercise APP-004 CPU diagnosis and targeted recovery
        run: bash scripts/app_incident_004.sh "$APP004_RELEASE"

      - name: Show APP-004 evidence summary
        if: always()
        run: |
          find "$APP004_EVIDENCE_DIR" -maxdepth 1 -type f -print | sort || true
          cat "$APP004_EVIDENCE_DIR/baseline-latency-summary.txt" 2>/dev/null || true
          cat "$APP004_EVIDENCE_DIR/degraded-latency-summary.txt" 2>/dev/null || true
          cat "$APP004_EVIDENCE_DIR/diagnosis.txt" 2>/dev/null || true
          cat "$APP004_EVIDENCE_DIR/recovered-latency-summary.txt" 2>/dev/null || true
          cat "$APP004_EVIDENCE_DIR/recovery.txt" 2>/dev/null || true

      - name: Upload APP-004 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-app004-evidence-${{ github.run_id }}
          path: .opsforge/evidence/app-004
          if-no-files-found: warn
          retention-days: 7

      - name: Clean APP-004 environment
        if: always()
        run: bash scripts/down_environment.sh staging --volumes || true
