name: OPSFORGE Queue Worker Incidents

on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "api/**"
      - "rabbitmq/**"
      - "docker-compose.yml"
      - "scripts/qw_incident_*.sh"
      - "operations/records/INC-13*.json"
      - "operations/records/L2N-13*.json"
      - "operations/records/RUN-WORKER*.json"
      - "docs/PHASE6-QUEUE-WORKER.md"
      - "docs/QW-*.md"
      - ".github/workflows/queue-worker-incidents.yml"
  workflow_dispatch:

jobs:
  qw-001-consumer-missing:
    runs-on: ubuntu-latest
    env:
      OPSFORGE_PROJECT_NAME: opsforge-qw001
      OPSFORGE_CONTAINER_PREFIX: nightwatch-qw001
      OPSFORGE_NETWORK_NAME: nightwatch-qw001-net
      APP_ENV: qw001
      RELEASE_VERSION: qw001-ci
      API_HOST_PORT: "18101"
      POSTGRES_USER: nightwatch
      POSTGRES_DB: nightwatch
      POSTGRES_PASSWORD: opsforge-ci-db-password
      RABBITMQ_USER: nightwatch
      RABBITMQ_PASSWORD: opsforge-ci-rabbit-password
      GRAFANA_ADMIN_USER: opsforge
      GRAFANA_ADMIN_PASSWORD: opsforge-ci-grafana-password
      QW001_API_URL: http://127.0.0.1:18101
      QW001_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/qw-001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate QW-001 shell syntax
        run: bash -n scripts/qw_incident_001.sh

      - name: Build QW-001 application images
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml build api worker

      - name: Start stable queue worker environment
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml up -d api worker

      - name: Exercise missing consumer diagnosis and worker-only recovery
        run: bash scripts/qw_incident_001.sh exercise

      - name: Show QW-001 evidence summary
        if: always()
        run: |
          find "$QW001_EVIDENCE_DIR" -maxdepth 1 -type f -print | sort || true
          cat "$QW001_EVIDENCE_DIR/baseline-queue-state-after.txt" 2>/dev/null || true
          cat "$QW001_EVIDENCE_DIR/incident-dependency-health.txt" 2>/dev/null || true
          cat "$QW001_EVIDENCE_DIR/incident-queue-state.txt" 2>/dev/null || true
          cat "$QW001_EVIDENCE_DIR/post-recovery-queue-state.txt" 2>/dev/null || true
          cat "$QW001_EVIDENCE_DIR/post-recovery-processing-status.txt" 2>/dev/null || true

      - name: Upload QW-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-qw001-evidence-${{ github.run_id }}
          path: .opsforge/evidence/qw-001
          if-no-files-found: warn
          retention-days: 7

      - name: Clean QW-001 environment
        if: always()
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml down -v --remove-orphans

  qw-002-processing-failure-retry:
    runs-on: ubuntu-latest
    env:
      OPSFORGE_PROJECT_NAME: opsforge-qw002
      OPSFORGE_CONTAINER_PREFIX: nightwatch-qw002
      OPSFORGE_NETWORK_NAME: nightwatch-qw002-net
      APP_ENV: qw002
      RELEASE_VERSION: qw002-ci
      API_HOST_PORT: "18102"
      POSTGRES_USER: nightwatch
      POSTGRES_DB: nightwatch
      POSTGRES_PASSWORD: opsforge-ci-db-password
      RABBITMQ_USER: nightwatch
      RABBITMQ_PASSWORD: opsforge-ci-rabbit-password
      GRAFANA_ADMIN_USER: opsforge
      GRAFANA_ADMIN_PASSWORD: opsforge-ci-grafana-password
      QW002_API_URL: http://127.0.0.1:18102
      QW002_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/qw-002

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate QW-002 shell syntax
        run: bash -n scripts/qw_incident_002.sh

      - name: Build QW-002 application images
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml build api worker

      - name: Start stable queue worker environment
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml up -d api worker

      - name: Exercise processing failure diagnosis and retry recovery
        run: bash scripts/qw_incident_002.sh exercise

      - name: Show QW-002 evidence summary
        if: always()
        run: |
          find "$QW002_EVIDENCE_DIR" -maxdepth 1 -type f -print | sort || true
          cat "$QW002_EVIDENCE_DIR/baseline-queue-state-after.txt" 2>/dev/null || true
          cat "$QW002_EVIDENCE_DIR/incident-failure-count.txt" 2>/dev/null || true
          cat "$QW002_EVIDENCE_DIR/incident-dependency-health.txt" 2>/dev/null || true
          cat "$QW002_EVIDENCE_DIR/incident-queue-state.txt" 2>/dev/null || true
          cat "$QW002_EVIDENCE_DIR/post-recovery-retry-summary.txt" 2>/dev/null || true
          cat "$QW002_EVIDENCE_DIR/post-recovery-queue-state.txt" 2>/dev/null || true
          cat "$QW002_EVIDENCE_DIR/post-recovery-processing-status.txt" 2>/dev/null || true

      - name: Upload QW-002 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-qw002-evidence-${{ github.run_id }}
          path: .opsforge/evidence/qw-002
          if-no-files-found: warn
          retention-days: 7

      - name: Clean QW-002 environment
        if: always()
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml down -v --remove-orphans
