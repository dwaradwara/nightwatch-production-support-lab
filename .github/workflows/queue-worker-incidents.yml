name: OPSFORGE Queue Worker Incidents

on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "api/**"
      - "rabbitmq/**"
      - "docker-compose.yml"
      - "scripts/qw_incident_*.sh"
      - "operations/records/INC-13*.json"
      - "operations/records/L2N-13*.json"
      - "operations/records/L3E-13*.json"
      - "operations/records/RUN-WORKER*.json"
      - "docs/PHASE6-QUEUE-WORKER.md"
      - "docs/QW-*.md"
      - ".github/workflows/queue-worker-incidents.yml"
  workflow_dispatch:

jobs:
  qw-001-consumer-missing:
    runs-on: ubuntu-latest
    env:
      OPSFORGE_PROJECT_NAME: opsforge-qw001
      OPSFORGE_CONTAINER_PREFIX: nightwatch-qw001
      OPSFORGE_NETWORK_NAME: nightwatch-qw001-net
      APP_ENV: qw001
      RELEASE_VERSION: qw001-ci
      API_HOST_PORT: "18101"
      POSTGRES_USER: nightwatch
      POSTGRES_DB: nightwatch
      POSTGRES_PASSWORD: opsforge-ci-db-password
      RABBITMQ_USER: nightwatch
      RABBITMQ_PASSWORD: opsforge-ci-rabbit-password
      GRAFANA_ADMIN_USER: opsforge
      GRAFANA_ADMIN_PASSWORD: opsforge-ci-grafana-password
      QW001_API_URL: http://127.0.0.1:18101
      QW001_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/qw-001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate QW-001 shell syntax
        run: bash -n scripts/qw_incident_001.sh

      - name: Build QW-001 application images
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml build api worker

      - name: Start stable queue worker environment
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml up -d api worker

      - name: Exercise missing consumer diagnosis and worker-only recovery
        run: bash scripts/qw_incident_001.sh exercise

      - name: Show QW-001 evidence summary
        if: always()
        run: |
          find "$QW001_EVIDENCE_DIR" -maxdepth 1 -type f -print | sort || true
          cat "$QW001_EVIDENCE_DIR/baseline-queue-state-after.txt" 2>/dev/null || true
          cat "$QW001_EVIDENCE_DIR/incident-dependency-health.txt" 2>/dev/null || true
          cat "$QW001_EVIDENCE_DIR/incident-queue-state.txt" 2>/dev/null || true
          cat "$QW001_EVIDENCE_DIR/post-recovery-queue-state.txt" 2>/dev/null || true
          cat "$QW001_EVIDENCE_DIR/post-recovery-processing-status.txt" 2>/dev/null || true

      - name: Upload QW-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-qw001-evidence-${{ github.run_id }}
          path: .opsforge/evidence/qw-001
          if-no-files-found: warn
          retention-days: 7

      - name: Clean QW-001 environment
        if: always()
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml down -v --remove-orphans

  qw-002-processing-failure-retry:
    runs-on: ubuntu-latest
    env:
      OPSFORGE_PROJECT_NAME: opsforge-qw002
      OPSFORGE_CONTAINER_PREFIX: nightwatch-qw002
      OPSFORGE_NETWORK_NAME: nightwatch-qw002-net
      APP_ENV: qw002
      RELEASE_VERSION: qw002-ci
      API_HOST_PORT: "18102"
      POSTGRES_USER: nightwatch
      POSTGRES_DB: nightwatch
      POSTGRES_PASSWORD: opsforge-ci-db-password
      RABBITMQ_USER: nightwatch
      RABBITMQ_PASSWORD: opsforge-ci-rabbit-password
      GRAFANA_ADMIN_USER: opsforge
      GRAFANA_ADMIN_PASSWORD: opsforge-ci-grafana-password
      QW002_API_URL: http://127.0.0.1:18102
      QW002_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/qw-002

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate QW-002 shell syntax
        run: bash -n scripts/qw_incident_002.sh

      - name: Build QW-002 application images
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml build api worker

      - name: Prepare QW-002 transient retry override
        run: |
          mkdir -p .opsforge
          cat > .opsforge/qw002-compose-override.yml <<'YAML'
          services:
            worker:
              environment:
                WORKER_MAX_RETRIES: "100"
          YAML

      - name: Start stable queue worker environment
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml -f .opsforge/qw002-compose-override.yml up -d api worker

      - name: Exercise processing failure diagnosis and retry recovery
        run: bash scripts/qw_incident_002.sh exercise

      - name: Show QW-002 evidence summary
        if: always()
        run: |
          find "$QW002_EVIDENCE_DIR" -maxdepth 1 -type f -print | sort || true
          cat "$QW002_EVIDENCE_DIR/baseline-queue-state-after.txt" 2>/dev/null || true
          cat "$QW002_EVIDENCE_DIR/incident-failure-count.txt" 2>/dev/null || true
          cat "$QW002_EVIDENCE_DIR/incident-dependency-health.txt" 2>/dev/null || true
          cat "$QW002_EVIDENCE_DIR/incident-queue-state.txt" 2>/dev/null || true
          cat "$QW002_EVIDENCE_DIR/post-recovery-retry-summary.txt" 2>/dev/null || true
          cat "$QW002_EVIDENCE_DIR/post-recovery-queue-state.txt" 2>/dev/null || true
          cat "$QW002_EVIDENCE_DIR/post-recovery-processing-status.txt" 2>/dev/null || true

      - name: Upload QW-002 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-qw002-evidence-${{ github.run_id }}
          path: .opsforge/evidence/qw-002
          if-no-files-found: warn
          retention-days: 7

      - name: Clean QW-002 environment
        if: always()
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml down -v --remove-orphans

  qw-003-queue-backlog:
    runs-on: ubuntu-latest
    env:
      OPSFORGE_PROJECT_NAME: opsforge-qw003
      OPSFORGE_CONTAINER_PREFIX: nightwatch-qw003
      OPSFORGE_NETWORK_NAME: nightwatch-qw003-net
      APP_ENV: qw003
      RELEASE_VERSION: qw003-ci
      API_HOST_PORT: "18103"
      POSTGRES_USER: nightwatch
      POSTGRES_DB: nightwatch
      POSTGRES_PASSWORD: opsforge-ci-db-password
      RABBITMQ_USER: nightwatch
      RABBITMQ_PASSWORD: opsforge-ci-rabbit-password
      GRAFANA_ADMIN_USER: opsforge
      GRAFANA_ADMIN_PASSWORD: opsforge-ci-grafana-password
      QW003_API_URL: http://127.0.0.1:18103
      QW003_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/qw-003
      QW003_BATCH_SIZE: "10"
      QW003_BATCH_COUNT: "3"
      QW003_PROCESSING_DELAY_SECONDS: "0.60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate QW-003 shell syntax
        run: bash -n scripts/qw_incident_003.sh

      - name: Build QW-003 application images
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml build api worker

      - name: Start stable queue worker environment
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml up -d api worker

      - name: Exercise backlog diagnosis and no-restart recovery
        run: bash scripts/qw_incident_003.sh exercise

      - name: Show QW-003 evidence summary
        if: always()
        run: |
          find "$QW003_EVIDENCE_DIR" -maxdepth 1 -type f -print | sort || true
          cat "$QW003_EVIDENCE_DIR/incident-arrival-summary.txt" 2>/dev/null || true
          cat "$QW003_EVIDENCE_DIR/incident-backlog-growth.txt" 2>/dev/null || true
          cat "$QW003_EVIDENCE_DIR/incident-progress-queue-state.txt" 2>/dev/null || true
          cat "$QW003_EVIDENCE_DIR/incident-worker-outcome-summary.txt" 2>/dev/null || true
          cat "$QW003_EVIDENCE_DIR/recovery-drain-duration.txt" 2>/dev/null || true
          cat "$QW003_EVIDENCE_DIR/post-recovery-queue-state.txt" 2>/dev/null || true
          cat "$QW003_EVIDENCE_DIR/post-recovery-ticket-summary.txt" 2>/dev/null || true
          cat "$QW003_EVIDENCE_DIR/post-recovery-worker-outcome-summary.txt" 2>/dev/null || true

      - name: Upload QW-003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-qw003-evidence-${{ github.run_id }}
          path: .opsforge/evidence/qw-003
          if-no-files-found: warn
          retention-days: 7

      - name: Clean QW-003 environment
        if: always()
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml down -v --remove-orphans

  qw-004-poison-job:
    runs-on: ubuntu-latest
    env:
      OPSFORGE_PROJECT_NAME: opsforge-qw004
      OPSFORGE_CONTAINER_PREFIX: nightwatch-qw004
      OPSFORGE_NETWORK_NAME: nightwatch-qw004-net
      APP_ENV: qw004
      RELEASE_VERSION: qw004-ci
      API_HOST_PORT: "18104"
      POSTGRES_USER: nightwatch
      POSTGRES_DB: nightwatch
      POSTGRES_PASSWORD: opsforge-ci-db-password
      RABBITMQ_USER: nightwatch
      RABBITMQ_PASSWORD: opsforge-ci-rabbit-password
      GRAFANA_ADMIN_USER: opsforge
      GRAFANA_ADMIN_PASSWORD: opsforge-ci-grafana-password
      QW004_API_URL: http://127.0.0.1:18104
      QW004_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/qw-004
      QW004_HEALTHY_COUNT: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate QW-004 syntax
        run: |
          bash -n scripts/qw_incident_004.sh
          python -m py_compile worker/worker.py

      - name: Build QW-004 application images
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml build api worker

      - name: Start stable queue worker environment
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml up -d api worker

      - name: Exercise poison-job quarantine and corrected replay
        run: bash scripts/qw_incident_004.sh exercise

      - name: Show QW-004 evidence summary
        if: always()
        run: |
          find "$QW004_EVIDENCE_DIR" -maxdepth 1 -type f -print | sort || true
          cat "$QW004_EVIDENCE_DIR/worker-max-retries.txt" 2>/dev/null || true
          cat "$QW004_EVIDENCE_DIR/incident-poison-outcomes.txt" 2>/dev/null || true
          cat "$QW004_EVIDENCE_DIR/incident-main-queue-state.txt" 2>/dev/null || true
          cat "$QW004_EVIDENCE_DIR/incident-quarantine-state.txt" 2>/dev/null || true
          cat "$QW004_EVIDENCE_DIR/incident-dependency-health.txt" 2>/dev/null || true
          cat "$QW004_EVIDENCE_DIR/recovery-quarantine-replay.json" 2>/dev/null || true
          cat "$QW004_EVIDENCE_DIR/post-recovery-poison-outcomes.txt" 2>/dev/null || true
          cat "$QW004_EVIDENCE_DIR/post-recovery-main-queue-state.txt" 2>/dev/null || true
          cat "$QW004_EVIDENCE_DIR/post-recovery-quarantine-state.txt" 2>/dev/null || true

      - name: Upload QW-004 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-qw004-evidence-${{ github.run_id }}
          path: .opsforge/evidence/qw-004
          if-no-files-found: warn
          retention-days: 7

      - name: Clean QW-004 environment
        if: always()
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml down -v --remove-orphans
