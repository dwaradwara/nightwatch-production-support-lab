name: NIGHTWATCH OPSFORGE CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-delivery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: |
          pip install -r api/requirements.txt
          pip install -r worker/requirements.txt
          pip install -r synthetic/requirements.txt

      - name: Static validation
        run: |
          python -m py_compile api/app.py
          python -m py_compile worker/worker.py
          python -m py_compile synthetic/synthetic.py
          python -c "import pika, psycopg, redis, prometheus_client; print('runtime imports ok')"
          python -m json.tool grafana/dashboards/opsforge-l2-operations.json >/dev/null
          bash -n scripts/*.sh
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.12.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Prepare CI secrets and TLS
        run: |
          cp .env.example .env
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout tls/nightwatch-fixed.key \
            -out tls/nightwatch-fixed.crt \
            -days 1 \
            -subj "/CN=nightwatch.local" \
            -addext "subjectAltName=DNS:nightwatch.local"

      - name: Define release versions
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "GOOD_RELEASE=git-$SHORT_SHA" >> "$GITHUB_ENV"
          echo "BAD_RELEASE=git-$SHORT_SHA-regression" >> "$GITHUB_ENV"

      - name: Validate isolated Compose environments
        run: |
          set -a
          source .env
          set +a
          source scripts/release_env.sh

          configure_opsforge_environment staging
          RELEASE_VERSION="$GOOD_RELEASE" opsforge_compose config --quiet

          configure_opsforge_environment production
          RELEASE_VERSION="$GOOD_RELEASE" opsforge_compose config --quiet

      - name: Build versioned release images
        run: bash scripts/build_release.sh "$GOOD_RELEASE"

      - name: Promote release to staging
        run: bash scripts/promote_release.sh staging "$GOOD_RELEASE"

      - name: Prove staging release identity
        run: |
          source scripts/release_env.sh
          load_opsforge_secrets
          configure_opsforge_environment staging
          curl -fsS "http://127.0.0.1:$NGINX_HTTP_HOST_PORT/version" | \
            python -c 'import json,sys,os; p=json.load(sys.stdin); assert p["environment"]=="staging"; assert p["version"]==os.environ["GOOD_RELEASE"]'

      - name: Retire staging after promotion gate
        run: bash scripts/down_environment.sh staging --volumes

      - name: Promote verified release to production
        run: bash scripts/promote_release.sh production "$GOOD_RELEASE"

      - name: Assert production last-good state
        run: |
          test "$(cat .opsforge/state/production.current)" = "$GOOD_RELEASE"
          source scripts/release_env.sh
          load_opsforge_secrets
          configure_opsforge_environment production
          curl -fsS "http://127.0.0.1:$NGINX_HTTP_HOST_PORT/version" | \
            python -c 'import json,sys,os; p=json.load(sys.stdin); assert p["environment"]=="production"; assert p["version"]==os.environ["GOOD_RELEASE"]'

      - name: Build controlled bad release
        run: bash scripts/build_release.sh "$BAD_RELEASE" ticket-create-500

      - name: Exercise failed production deployment and rollback
        run: |
          set +e
          bash scripts/promote_release.sh production "$BAD_RELEASE"
          PROMOTION_STATUS=$?
          set -e

          if [[ "$PROMOTION_STATUS" -eq 0 ]]; then
            echo "Bad release was incorrectly accepted" >&2
            exit 1
          fi

          test "$(cat .opsforge/state/production.current)" = "$GOOD_RELEASE"
          grep -F "$BAD_RELEASE" .opsforge/state/rollback-history.tsv | grep -F "$GOOD_RELEASE"
          echo "Bad release rejected and last-good production release restored"

      - name: Verify production after rollback
        run: bash scripts/verify_release.sh production "$GOOD_RELEASE"

      - name: Show release evidence
        if: always()
        run: |
          echo "--- release manifests ---"
          find .opsforge/releases -maxdepth 1 -type f -print -exec cat {} \; 2>/dev/null || true
          echo "--- release state ---"
          find .opsforge/state -maxdepth 1 -type f -print -exec cat {} \; 2>/dev/null || true
          echo "--- verification failures ---"
          find .opsforge/diagnostics -name failure.txt -print -exec cat {} \; 2>/dev/null || true

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-verification-diagnostics-${{ github.run_id }}
          path: .opsforge/diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Clean staging environment
        if: always()
        run: bash scripts/down_environment.sh staging --volumes || true

      - name: Clean production environment
        if: always()
        run: bash scripts/down_environment.sh production --volumes || true
