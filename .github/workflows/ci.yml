name: NIGHTWATCH CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Python syntax check
        run: python -m py_compile api/app.py

      - name: Build NIGHTWATCH API image
        run: docker build -t nightwatch-api:ci ./api

      - name: Build NIGHTWATCH Worker image
        run: docker build -t nightwatch-worker:ci ./worker