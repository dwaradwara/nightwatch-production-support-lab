name: OPSFORGE DB-005 Migration Incident

on:
  pull_request:
    branches: [main]
    paths:
      - "db/incidents/db005-*.sql"
      - "scripts/db_incident_005.sh"
      - "operations/records/INC-1105.json"
      - "operations/records/L2N-1105.json"
      - "operations/records/RUN-DB-MIGRATION-MISMATCH.json"
      - "docs/DB-005-INCOMPATIBLE-MIGRATION.md"
      - ".github/workflows/db005-migration.yml"
  workflow_dispatch:

jobs:
  db-005-incompatible-migration:
    runs-on: ubuntu-latest
    env:
      OPSFORGE_PROJECT_NAME: opsforge-db005
      OPSFORGE_CONTAINER_PREFIX: nightwatch-db005
      OPSFORGE_NETWORK_NAME: nightwatch-db005-net
      APP_ENV: db005
      RELEASE_VERSION: db005-ci
      API_HOST_PORT: "18005"
      POSTGRES_USER: nightwatch
      POSTGRES_DB: nightwatch
      POSTGRES_PASSWORD: opsforge-ci-db-password
      RABBITMQ_USER: nightwatch
      RABBITMQ_PASSWORD: opsforge-ci-rabbit-password
      GRAFANA_ADMIN_USER: opsforge
      GRAFANA_ADMIN_PASSWORD: opsforge-ci-grafana-password
      DB005_API_URL: http://127.0.0.1:18005
      DB005_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/db-005

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate DB-005 shell syntax
        run: bash -n scripts/db_incident_005.sh

      - name: Build DB-005 API image
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml build api

      - name: Start stable DB-005 application environment
        run: |
          docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml up -d api
          for attempt in {1..60}; do
            seeded=$(docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml exec -T db \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -Atc \
              "SELECT count(*) FROM customer_activity WHERE id = 84;" 2>/dev/null || true)
            ready=$(curl -sS -o /tmp/db005-ready.json -w '%{http_code}' \
              "$DB005_API_URL/health/ready" 2>/dev/null || true)
            if [[ "$seeded" = "1" && "$ready" = "200" ]]; then
              sleep 2
              stable=$(curl -sS -o /tmp/db005-stable.json -w '%{http_code}' \
                "$DB005_API_URL/api/tickets" 2>/dev/null || true)
              if [[ "$stable" = "200" ]]; then
                exit 0
              fi
            fi
            sleep 1
          done
          docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml ps
          docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml logs --no-color db api redis rabbitmq tempo
          exit 1

      - name: Exercise incompatible migration diagnosis and rollback
        run: bash scripts/db_incident_005.sh exercise

      - name: Upload DB-005 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-db005-evidence-${{ github.run_id }}
          path: .opsforge/evidence/db-005
          if-no-files-found: warn
          retention-days: 7

      - name: Clean DB-005 environment
        if: always()
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml down -v --remove-orphans
