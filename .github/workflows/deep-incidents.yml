name: OPSFORGE Deep Incidents

on:
  pull_request:
    branches: [main]
    paths:
      - "db/**"
      - "scripts/db_incident_*.sh"
      - "operations/records/**"
      - "docs/PHASE6-DATABASE.md"
      - "docs/DB-*.md"
      - ".github/workflows/deep-incidents.yml"
  workflow_dispatch:

jobs:
  db-001-missing-index:
    runs-on: ubuntu-latest
    env:
      OPSFORGE_PROJECT_NAME: opsforge-db001
      OPSFORGE_CONTAINER_PREFIX: nightwatch-db001
      OPSFORGE_NETWORK_NAME: nightwatch-db001-net
      POSTGRES_USER: nightwatch
      POSTGRES_DB: nightwatch
      POSTGRES_PASSWORD: opsforge-ci-db-password
      RABBITMQ_USER: nightwatch
      RABBITMQ_PASSWORD: opsforge-ci-rabbit-password
      GRAFANA_ADMIN_USER: opsforge
      GRAFANA_ADMIN_PASSWORD: opsforge-ci-grafana-password
      DB001_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/db-001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate incident script syntax
        run: bash -n scripts/db_incident_001.sh

      - name: Start isolated PostgreSQL incident environment
        run: |
          docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml up -d db
          for attempt in {1..30}; do
            if docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml exec -T db \
              pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml logs db
          exit 1

      - name: Prove indexed baseline
        run: bash scripts/db_incident_001.sh baseline

      - name: Inject missing-index regression
        run: bash scripts/db_incident_001.sh inject

      - name: Diagnose sequential-scan regression
        run: bash scripts/db_incident_001.sh diagnose

      - name: Recover approved index
        run: bash scripts/db_incident_001.sh recover

      - name: Prove query-plan recovery
        run: bash scripts/db_incident_001.sh verify

      - name: Upload DB-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-db001-evidence-${{ github.run_id }}
          path: .opsforge/evidence/db-001
          if-no-files-found: warn
          retention-days: 7

      - name: Clean DB-001 environment
        if: always()
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml down -v --remove-orphans

  db-002-lock-contention:
    runs-on: ubuntu-latest
    env:
      OPSFORGE_PROJECT_NAME: opsforge-db002
      OPSFORGE_CONTAINER_PREFIX: nightwatch-db002
      OPSFORGE_NETWORK_NAME: nightwatch-db002-net
      POSTGRES_USER: nightwatch
      POSTGRES_DB: nightwatch
      POSTGRES_PASSWORD: opsforge-ci-db-password
      RABBITMQ_USER: nightwatch
      RABBITMQ_PASSWORD: opsforge-ci-rabbit-password
      GRAFANA_ADMIN_USER: opsforge
      GRAFANA_ADMIN_PASSWORD: opsforge-ci-grafana-password
      DB002_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/db-002

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate incident script syntax
        run: bash -n scripts/db_incident_002.sh

      - name: Start isolated PostgreSQL lock environment
        run: |
          docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml up -d db
          for attempt in {1..30}; do
            if docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml exec -T db \
              pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml logs db
          exit 1

      - name: Exercise blocker diagnosis and targeted recovery
        run: bash scripts/db_incident_002.sh exercise

      - name: Upload DB-002 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-db002-evidence-${{ github.run_id }}
          path: .opsforge/evidence/db-002
          if-no-files-found: warn
          retention-days: 7

      - name: Clean DB-002 environment
        if: always()
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml down -v --remove-orphans

  db-003-long-transaction:
    runs-on: ubuntu-latest
    env:
      OPSFORGE_PROJECT_NAME: opsforge-db003
      OPSFORGE_CONTAINER_PREFIX: nightwatch-db003
      OPSFORGE_NETWORK_NAME: nightwatch-db003-net
      POSTGRES_USER: nightwatch
      POSTGRES_DB: nightwatch
      POSTGRES_PASSWORD: opsforge-ci-db-password
      RABBITMQ_USER: nightwatch
      RABBITMQ_PASSWORD: opsforge-ci-rabbit-password
      GRAFANA_ADMIN_USER: opsforge
      GRAFANA_ADMIN_PASSWORD: opsforge-ci-grafana-password
      DB003_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/db-003
      DB003_MIN_AGE_SECONDS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate incident script syntax
        run: bash -n scripts/db_incident_003.sh

      - name: Start stable PostgreSQL long-transaction environment
        run: |
          docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml up -d db
          for attempt in {1..40}; do
            ready=$(docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml exec -T db \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -Atc \
              "SELECT count(*) FROM customer_activity WHERE id = 84;" 2>/dev/null || true)
            if [[ "$ready" = "1" ]]; then
              sleep 2
              stable=$(docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml exec -T db \
                psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -Atc \
                "SELECT count(*) FROM customer_activity WHERE id = 84;" 2>/dev/null || true)
              if [[ "$stable" = "1" ]]; then
                exit 0
              fi
            fi
            sleep 1
          done
          docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml logs db
          exit 1

      - name: Exercise stale transaction diagnosis and targeted recovery
        run: bash scripts/db_incident_003.sh exercise

      - name: Upload DB-003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-db003-evidence-${{ github.run_id }}
          path: .opsforge/evidence/db-003
          if-no-files-found: warn
          retention-days: 7

      - name: Clean DB-003 environment
        if: always()
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml down -v --remove-orphans

  db-004-connection-exhaustion:
    runs-on: ubuntu-latest
    env:
      OPSFORGE_PROJECT_NAME: opsforge-db004
      OPSFORGE_CONTAINER_PREFIX: nightwatch-db004
      OPSFORGE_NETWORK_NAME: nightwatch-db004-net
      POSTGRES_USER: nightwatch
      POSTGRES_DB: nightwatch
      POSTGRES_PASSWORD: opsforge-ci-db-password
      RABBITMQ_USER: nightwatch
      RABBITMQ_PASSWORD: opsforge-ci-rabbit-password
      GRAFANA_ADMIN_USER: opsforge
      GRAFANA_ADMIN_PASSWORD: opsforge-ci-grafana-password
      DB004_EVIDENCE_DIR: ${{ github.workspace }}/.opsforge/evidence/db-004
      DB004_MAX_CONNECTIONS: "12"
      DB004_POOL_HOLD_SECONDS: "20"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate incident script syntax
        run: bash -n scripts/db_incident_004.sh

      - name: Start stable PostgreSQL connection-capacity environment
        run: |
          docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml up -d db
          for attempt in {1..40}; do
            ready=$(docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml exec -T db \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -Atc \
              "SELECT count(*) FROM customer_activity WHERE id = 84;" 2>/dev/null || true)
            if [[ "$ready" = "1" ]]; then
              sleep 2
              stable=$(docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml exec -T db \
                psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -Atc \
                "SELECT count(*) FROM customer_activity WHERE id = 84;" 2>/dev/null || true)
              if [[ "$stable" = "1" ]]; then
                exit 0
              fi
            fi
            sleep 1
          done
          docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml logs db
          exit 1

      - name: Exercise connection saturation diagnosis and minimal recovery
        run: bash scripts/db_incident_004.sh exercise

      - name: Upload DB-004 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsforge-db004-evidence-${{ github.run_id }}
          path: .opsforge/evidence/db-004
          if-no-files-found: warn
          retention-days: 7

      - name: Clean DB-004 environment
        if: always()
        run: docker compose -p "$OPSFORGE_PROJECT_NAME" -f docker-compose.yml down -v --remove-orphans
