services:
  db:
    image: postgres:17.10-alpine3.23
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-db"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nightwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nightwatch}
    volumes:
      - nightwatch-db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      nightwatch-net:
        aliases: [nightwatch-db]

  redis:
    image: redis:7.4.9-alpine
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      nightwatch-net:
        aliases: [nightwatch-redis]

  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-rabbit"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nightwatch}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Copy .env.example to .env and set RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    expose:
      - "15692"
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      nightwatch-net:
        aliases: [nightwatch-rabbit]

  api:
    image: "nightwatch-api:${RELEASE_VERSION:-dev}"
    build: ./api
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-api"
    environment:
      SERVICE_NAME: nightwatch-api
      APP_ENV: ${APP_ENV:-dev}
      APP_VERSION: ${RELEASE_VERSION:-dev}
      DB_HOST: nightwatch-db
      DB_NAME: ${POSTGRES_DB:-nightwatch}
      DB_USER: ${POSTGRES_USER:-nightwatch}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      REDIS_HOST: nightwatch-redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: nightwatch-rabbit
      RABBITMQ_USER: ${RABBITMQ_USER:-nightwatch}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Copy .env.example to .env and set RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: nightwatch-jobs
      OTEL_SERVICE_NAME: nightwatch-api
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://nightwatch-tempo:4318/v1/traces
    command: ["opentelemetry-instrument", "python", "app.py"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    networks:
      nightwatch-net:
        aliases: [nightwatch-api]

  worker:
    image: "nightwatch-worker:${RELEASE_VERSION:-dev}"
    build: ./worker
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-worker"
    environment:
      SERVICE_NAME: nightwatch-worker
      APP_ENV: ${APP_ENV:-dev}
      APP_VERSION: ${RELEASE_VERSION:-dev}
      WORKER_METRICS_PORT: "9100"
      DB_HOST: nightwatch-db
      DB_NAME: ${POSTGRES_DB:-nightwatch}
      DB_USER: ${POSTGRES_USER:-nightwatch}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      RABBITMQ_HOST: nightwatch-rabbit
      RABBITMQ_USER: ${RABBITMQ_USER:-nightwatch}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Copy .env.example to .env and set RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: nightwatch-jobs
    expose:
      - "9100"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; body=urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=3).read().decode(); raise SystemExit(0 if 'nightwatch_worker_ready 1.0' in body else 1)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    networks:
      nightwatch-net:
        aliases: [nightwatch-worker]

  nginx:
    image: "nightwatch-nginx:${RELEASE_VERSION:-dev}"
    build: ./nginx
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-nginx"
    ports:
      - "${NGINX_HTTP_HOST_PORT:-8080}:80"
      - "${NGINX_HTTPS_HOST_PORT:-8443}:443"
    volumes:
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      nightwatch-net:
        aliases: [nightwatch-nginx]

  synthetic:
    image: "nightwatch-synthetic:${RELEASE_VERSION:-dev}"
    build: ./synthetic
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-synthetic"
    environment:
      SYNTHETIC_BASE_URL: http://nightwatch-nginx
      SYNTHETIC_METRICS_PORT: "9200"
      SYNTHETIC_INTERVAL_SECONDS: "10"
      SYNTHETIC_TIMEOUT_SECONDS: "15"
    expose:
      - "9200"
    depends_on:
      nginx:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/metrics', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    networks:
      nightwatch-net:
        aliases: [nightwatch-synthetic]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-postgres-exporter"
    environment:
      DATA_SOURCE_URI: "nightwatch-db:5432/${POSTGRES_DB:-nightwatch}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-nightwatch}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    command:
      - "--collector.long_running_transactions"
    expose:
      - "9187"
    depends_on:
      db:
        condition: service_healthy
    networks:
      nightwatch-net:
        aliases: [nightwatch-postgres-exporter]

  redis-exporter:
    image: oliver006/redis_exporter:v1.89.0
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-redis-exporter"
    command: ["--redis.addr=redis://nightwatch-redis:6379"]
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      nightwatch-net:
        aliases: [nightwatch-redis-exporter]

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-prometheus"
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      synthetic:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    networks:
      nightwatch-net:
        aliases: [nightwatch-prometheus]

  loki:
    image: grafana/loki:3.7.0
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-loki"
    command: ["--config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    networks:
      nightwatch-net:
        aliases: [nightwatch-loki]

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-alloy"
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      nightwatch-net:
        aliases: [nightwatch-alloy]

  tempo:
    image: grafana/tempo:3.0.0
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-tempo"
    command: ["--target=all", "--config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - nightwatch-tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_HTTP_HOST_PORT:-3200}:3200"
      - "127.0.0.1:${TEMPO_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${TEMPO_OTLP_HTTP_HOST_PORT:-4318}:4318"
    networks:
      nightwatch-net:
        aliases: [nightwatch-tempo]

  grafana:
    image: grafana/grafana:13.1.0
    container_name: "${OPSFORGE_CONTAINER_PREFIX:-nightwatch}-grafana"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-opsforge}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env and set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - nightwatch-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 10s
    networks:
      nightwatch-net:
        aliases: [nightwatch-grafana]

networks:
  nightwatch-net:
    name: ${OPSFORGE_NETWORK_NAME:-nightwatch-net}

volumes:
  nightwatch-db-data:
  nightwatch-tempo-data:
  nightwatch-grafana-data:
