global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "nightwatch-api"
    static_configs:
      - targets: ["nightwatch-api:8000"]

  - job_name: "nightwatch-worker"
    static_configs:
      - targets: ["nightwatch-worker:9100"]

  - job_name: "nightwatch-rabbitmq"
    static_configs:
      - targets: ["nightwatch-rabbit:15692"]

  - job_name: "nightwatch-synthetic"
    static_configs:
      - targets: ["nightwatch-synthetic:9200"]

  - job_name: "nightwatch-postgres"
    static_configs:
      - targets: ["nightwatch-postgres-exporter:9187"]

  - job_name: "nightwatch-redis"
    static_configs:
      - targets: ["nightwatch-redis-exporter:9121"]
