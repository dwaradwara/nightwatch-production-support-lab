log_format opsforge_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"service":"nightwatch-nginx",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time"'
'}';

access_log /var/log/nginx/access.log opsforge_json;

server {
    listen 80;

    location / {
        add_header Access-Control-Allow-Origin "http://localhost:3001" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Vary "Origin" always;
        add_header X-Request-ID $request_id always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://nightwatch-api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
    }
}

server {
    listen 443 ssl;
    server_name nightwatch.local;

    ssl_certificate     /etc/nginx/tls/nightwatch-fixed.crt;
    ssl_certificate_key /etc/nginx/tls/nightwatch-fixed.key;

    location / {
        add_header Access-Control-Allow-Origin "http://localhost:3001" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Vary "Origin" always;
        add_header X-Request-ID $request_id always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://nightwatch-api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
    }
}
